# Local containers. `make dev` starts the full stack (postgres/postgis, redis, minio, migrate, api, worker-jobs, web).
# Run from the repo root, e.g.:  make dev · make docker-test
# Local development only: the credentials below are throwaway defaults, and ports bind to 127.0.0.1.

name: inland-resilience

x-db-url: &db-url postgres://inland:inland@postgres:5432/inland?sslmode=disable

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: inland
      POSTGRES_PASSWORD: inland
      POSTGRES_DB: inland
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/seeds:/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U inland -d inland"]  # TCP: the first-run init server is socket-only
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:                         # object storage for Milestone 3 overlays; demo tiles use the `artifacts` volume
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: inland
      MINIO_ROOT_PASSWORD: inland-dev-only
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:                       # applies database/migrations, then exits (make migrate)
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes: [../database/migrations:/migrations:ro]
    command: ["-path", "/migrations", "-database", "postgres://inland:inland@postgres:5432/inland?sslmode=disable", "up"]
    restart: "no"

  api:                           # Go API (apps/api): http://localhost:8080
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    image: inland-resilience/api:dev
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
      ARTIFACTS_DIR: /artifacts
    ports: ["127.0.0.1:8080:8080"]
    volumes: [artifacts:/artifacts:ro]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker-jobs:                   # job runtime: consumes Redis `jobs`, runs the agent, publishes `job-events`
    image: inland-resilience/worker:dev
    build:
      context: ..
      dockerfile: infrastructure/docker/worker.Dockerfile
      target: worker
    command: ["jobs"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
      ARTIFACTS_DIR: /artifacts
      INLAND_DATA_MODE: ${INLAND_DATA_MODE:-fixture}
      INLAND_FIXTURE_TODAY: ${INLAND_FIXTURE_TODAY:-2026-09-24}
      REAPER_IDLE_MS: ${REAPER_IDLE_MS:-600000}
      JOB_TIMEOUT_S: ${JOB_TIMEOUT_S:-600}
      FAULT_INJECT: ${FAULT_INJECT:-}
      NWS_USER_AGENT: ${NWS_USER_AGENT:-inland-resilience-agent/0.1 (+https://github.com/samin1554/inland-resilience)}
    volumes: [artifacts:/artifacts]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:                           # React + MapLibre (apps/web): http://localhost:5173
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
    image: inland-resilience/web:dev
    environment:
      API_PROXY_TARGET: http://api:8080
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/worker.Dockerfile
      target: worker
    image: inland-resilience/worker:dev
    env_file:
      - path: ../.env            # FIRMS_MAP_KEY etc. Optional: fixture mode works without it.
        required: false
    environment:
      NWS_USER_AGENT: ${NWS_USER_AGENT:-inland-resilience-agent/0.1 (+https://github.com/samin1554/inland-resilience)}
    command: ["providers"]

  worker-test:
    image: inland-resilience/worker:dev
    depends_on:
      worker:
        condition: service_started
    profiles: ["test"]
    env_file:
      - path: ../.env
        required: false
    environment:
      NWS_USER_AGENT: ${NWS_USER_AGENT:-inland-resilience-agent/0.1 (+https://github.com/samin1554/inland-resilience)}
    entrypoint: ["pytest"]
    command: ["-q"]

  line-fire-demo:                # ADR-009 proof of concept: make demo-line-fire
    build:
      context: ..
      dockerfile: infrastructure/docker/worker.Dockerfile
      target: research
    image: inland-resilience/research:dev
    profiles: ["demo"]
    volumes:
      - ../docs/research/line-fire-2024/output:/out

volumes:
  pgdata:
  redisdata:
  miniodata:
  artifacts:
