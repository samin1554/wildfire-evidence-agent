<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ingestion-pipeline-title ingestion-pipeline-desc">
<title id="ingestion-pipeline-title">One kit in, one API out</title>
<desc id="ingestion-pipeline-desc">Ingestion pipeline: every provider is reached only through the connector kit, configured by providers.yaml and tested against recorded fixtures; a scheduled ingest mode writes normalized evidence into a PostGIS cache, and the inland_data API serves callers from that cache, falling back to a live fetch through the kit when data is stale.</desc>
