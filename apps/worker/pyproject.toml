[project]
name = "inland-worker"
version = "0.1.0"
description = "Inland Resilience Agent worker: data pipeline (connector kit, connectors, inland_data), jobs and agent"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "tenacity>=8.3",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "numpy>=1.26",
  "rasterio>=1.4",   # windowed COG reads for satellite imagery (kit/imagery.py, ADR-009)
  "pyproj>=3.6",
  "langgraph>=0.2",  # the agent's controlled workflow (spec §14)
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "jsonschema>=4.22",
  "referencing>=0.35",
  "openapi-spec-validator>=0.7",
  "ruff>=0.5",
]
# research scripts (apps/worker/research/): not needed by the worker itself
research = [
  "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inland_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls real provider APIs (needs network and, for some providers, keys in .env). Run with: make test-live",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
  "RUF012",
  "E501",  # line length is enforced by `ruff format`; long strings/URLs are left alone
]
